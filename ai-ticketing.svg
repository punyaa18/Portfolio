  <circle cx="100" cy="35" r="18" fill="#FFF"/>
  <path d="M 88 30 L 100 38 L 112 30 L 112 40 L 88 40 Z" fill="#0078D4"/>
  <circle cx="110" cy="28" r="3" fill="#DC3545"/>
  
  <!-- File/Box Icon -->
  <rect x="75" y="65" width="25" height="20" fill="#FFF" rx="2"/>
  <rect x="80" y="70" width="15" height="3" fill="#FFA500"/>
  <rect x="80" y="75" width="15" height="3" fill="#FFA500"/>
  <circle cx="103" cy="68" r="3" fill="#DC3545"/>
  
  <!-- AI/Robot Icon (center) -->
  <rect x="125" y="55" width="30" height="35" fill="#FFF" rx="5"/>
  <circle cx="135" cy="68" r="3" fill="#0078D4"/>
  <circle cx="145" cy="68" r="3" fill="#0078D4"/>
  <line x1="133" y1="78" x2="147" y2="78" stroke="#0078D4" stroke-width="2"/>
