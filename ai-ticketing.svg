  <line x1="25" y1="38" x2="45" y2="38" stroke="#0078D4" stroke-width="2"/>
  <line x1="25" y1="44" x2="40" y2="44" stroke="#0078D4" stroke-width="2"/>
  <circle cx="48" cy="35" r="5" fill="#DC3545"/>
  
  <rect x="20" y="70" width="30" height="35" fill="#FFF" rx="3"/>
  <line x1="25" y1="77" x2="45" y2="77" stroke="#0078D4" stroke-width="2"/>
  <line x1="25" y1="83" x2="45" y2="83" stroke="#0078D4" stroke-width="2"/>
  <line x1="25" y1="89" x2="40" y2="89" stroke="#0078D4" stroke-width="2"/>
